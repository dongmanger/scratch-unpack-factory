name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --legacy-peer-deps

      # The suite compiles real projects with the vendored 02 compiler, which is
      # CPU-bound; the default 5 s per-test timeout is too tight on CI runners.
      - run: node --test --test-concurrency=1 test/*.test.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=4096
